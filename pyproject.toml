[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stack-bound"
version = "0.1.0"
description = "Safe upper bound for every stack in an embedded firmware image"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pyelftools>=0.31",   # ELF + DWARF reader (ADR-0001 D1, D13)
    "capstone>=5.0",      # instruction decoding for the binary witness (ADR-0001 D2, D13)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
stack_bound = "stack_bound.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stack_bound = ["profiles/*.toml"]

[tool.trace_report]
# Requirement-ID prefixes whose impl/test coverage CI enforces (tools/trace_report.py).
# Add an area's prefix when that area is implemented, e.g. "REQ-SB-0" for inputs and witnesses.
gates = [
    # slice 1 (0.1.0): requirements implemented and tested in full
    "REQ-SB-001", "REQ-SB-002",
    "REQ-SB-151", "REQ-SB-152",
    "REQ-SB-202",
    "REQ-SB-301", "REQ-SB-302", "REQ-SB-304", "REQ-SB-305", "REQ-SB-308", "REQ-SB-309",
    "REQ-SB-402",
    "REQ-SB-501",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
